# Builds one of this repo's three packages and, when asked, releases it. The same workflow as REDnode's
# release.yml, so every Edgemodders tool releases the same way.
#
#   What                 Folder                        Built                                  Tag
#   REDcode              extensions/redcode            .vsix (Windows x64) and the Nexus zip  v<version>
#   REDnode HUD theme    extensions/rednode-hud-theme  .vsix (every platform)                 theme-v<version>
#   redcode-mcp          packages/redcode-mcp          the npm package (.tgz)                 mcp-v<version>
#
#   Run workflow (Actions tab)                  builds it and keeps the files as the run's artifact, to
#                                               install and test before a release; publishes nothing
#   Run workflow, "Make a release" ticked       also publishes it (an extension to the VS Code
#                                               Marketplace, VSCE_PAT, and Open VSX, OVSX_PAT;
#                                               redcode-mcp to npm with provenance, NPM_TOKEN) and makes
#                                               the GitHub release, which tags the commit. Stops first if
#                                               that tag exists (raise the version), if it is not run on
#                                               main, or if the folder's CHANGELOG.md has no section for
#                                               the version (tools/release-notes.mjs)
#   npm run release / release:theme / release:mcp   the same as ticking the box, from a terminal
#
# REDcode's vscode:prepublish runs scripts/check-bridge-release.mjs: no REDbridge release at
# redcode.minBridgeVersion with its win-x64 zip, no package. The Nexus zip (tools/nexus-zip.mjs) is
# uploaded to Nexus by hand. Only REDcode's releases become the repository's Latest release. The tokens
# are Edgemodders organisation secrets, shared with EDGEdeck's and EDGEmat's workflows.
# Release gate: make a release only after every test of the changes since the last release has passed.
name: Release

on:
  workflow_dispatch:
    inputs:
      what:
        description: What to build
        type: choice
        options: [REDcode, REDnode HUD theme, redcode-mcp]
        default: REDcode
      release:
        description: Make a release (publishes it and tags this commit). Only after every test has passed
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: What, and its version
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ inputs.what }}
        run: |
          case "${WHAT}" in
            REDcode)             dir=extensions/redcode;           prefix=v;       kind=extension; target="--target win32-x64" ;;
            "REDnode HUD theme") dir=extensions/rednode-hud-theme; prefix=theme-v; kind=extension; target="" ;;
            redcode-mcp)         dir=packages/redcode-mcp;         prefix=mcp-v;   kind=npm;       target="" ;;
            *) echo "::error::Unknown package ${WHAT}"; exit 1 ;;
          esac
          name=$(node -p "require('./${dir}/package.json').name")
          version=$(node -p "require('./${dir}/package.json').version")
          {
            echo "DIR=${dir}"; echo "KIND=${kind}"; echo "TARGET=${target}"
            echo "NAME=${name}"; echo "VERSION=${version}"; echo "TAG=${prefix}${version}"
            echo "VSIX=${GITHUB_WORKSPACE}/dist/${name}-${version}.vsix"
          } >> "$GITHUB_ENV"
          if [ "${{ inputs.release }}" = "true" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Releases are made from main, not ${GITHUB_REF_NAME}"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${prefix}${version}" --silent >/dev/null 2>&1; then
              echo "::error::${prefix}${version} is already released. Raise the version in ${dir}/package.json."
              exit 1
            fi
          fi

      # Before anything is built: no CHANGELOG.md section for the version stops a release here.
      - name: Release notes from the CHANGELOG
        if: inputs.release
        run: node tools/release-notes.mjs "${DIR}" "${VERSION}" --out "${RUNNER_TEMP}/notes.md"

      - run: npm ci

      - name: Typecheck
        if: env.DIR != 'extensions/rednode-hud-theme'
        run: npm run typecheck --workspace "${DIR}"

      - name: Package the extension
        id: package
        if: env.KIND == 'extension'
        env:
          # REDcode's vscode:prepublish asks GitHub for the latest REDbridge release; anonymous calls
          # from shared runners hit the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cd "${DIR}"
          "${GITHUB_WORKSPACE}/node_modules/.bin/vsce" package --no-dependencies ${TARGET} --out "${VSIX}"

      - name: Nexus zip
        if: env.DIR == 'extensions/redcode'
        run: node tools/nexus-zip.mjs

      - name: Build the npm package
        if: env.KIND == 'npm'
        run: |
          npm run mcp:build
          mkdir -p dist
          npm pack --workspace "${DIR}" --pack-destination dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.what }}
          path: |
            dist/*.vsix
            dist/*-nexus.zip
            dist/*.tgz
          if-no-files-found: error

      - name: VS Code Marketplace
        if: inputs.release && env.KIND == 'extension'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # --skip-duplicate: a re-run of a release that got partway does not fail on what is already out.
        run: node_modules/.bin/vsce publish --packagePath "${VSIX}" --skip-duplicate

      # Each registry is tried even when another one failed; the run still fails if any of them did.
      - name: Open VSX
        if: ${{ inputs.release && env.KIND == 'extension' && !cancelled() && steps.package.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::warning::OVSX_PAT is not set; not published to Open VSX"
            exit 0
          fi
          node_modules/.bin/ovsx publish "${VSIX}" --pat "${OVSX_PAT}" --skip-duplicate

      # npm stages a new publish: a 0.0.0-stage placeholder shows for about six minutes before the version.
      - name: npm
        if: inputs.release && env.KIND == 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME} ${VERSION} is already on npm"
            exit 0
          fi
          npm publish --workspace "${DIR}" --provenance --access public

      # Makes the tag too (--target: this commit). Only REDcode becomes the repository's Latest release.
      - name: GitHub release
        if: ${{ inputs.release && !cancelled() && (env.KIND == 'npm' || steps.package.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ inputs.what }}
        run: |
          files=()
          latest="--latest=false"
          case "${WHAT}" in
            REDcode)             files=("${VSIX}" "dist/REDcode-${VERSION}-nexus.zip"); latest="" ;;
            "REDnode HUD theme") files=("${VSIX}"); title="REDnode HUD" ;;
          esac
          gh release create "${TAG}" "${files[@]}" --target "${GITHUB_SHA}" --title "${title:-${WHAT}} ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" ${latest}
